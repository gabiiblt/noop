[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noop-selfhost"
version = "0.1.0"
description = "Self-hosted receiver and read-only MCP server for NOOP data (personal use)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx[http2]>=0.27",
  "PyJWT[crypto]>=2.8",
  "mcp>=2.3,<3",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
noop-receiver = "noop_selfhost.receiver:main"
noop-mcp = "noop_selfhost.mcp_server:main"
noop-push-simulator = "noop_selfhost.simulator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
